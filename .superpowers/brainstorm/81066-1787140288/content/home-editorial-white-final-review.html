<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页白纸编辑感 · 最终确认</title>
  <style>
    *{box-sizing:border-box} body{min-height:100vh;margin:0;color:#17211d;background:radial-gradient(circle at 10% 8%,#fff,transparent 26%),radial-gradient(circle at 88% 82%,rgba(185,206,197,.42),transparent 28%),#edf2ef;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.review{width:min(1060px,calc(100% - 36px));min-height:100vh;display:grid;grid-template-columns:minmax(320px,440px) minmax(270px,370px);align-items:center;justify-content:center;gap:clamp(38px,7vw,86px);margin:auto;padding:36px 0}
    .phone{min-height:790px;position:relative;overflow:hidden;padding:28px 26px;border:1px solid #dfe7e3;border-radius:38px;background:#fffefa;box-shadow:0 32px 90px rgba(42,65,55,.18)}.phone::before{content:"";position:absolute;top:0;bottom:0;left:50px;width:1px;background:linear-gradient(transparent,rgba(111,149,133,.14) 15%,rgba(111,149,133,.14) 85%,transparent)}
    .date{position:relative;z-index:3;display:flex;align-items:center;gap:10px;color:#6f9585;font-family:Georgia,serif;font-size:9px;font-weight:700;letter-spacing:.22em}.date i{width:34px;height:1px;background:#b9c9c2}.copy{position:relative;z-index:3;padding-top:80px}.eyebrow{margin:0 0 18px;color:#6f9585;font-size:10px;font-weight:800;letter-spacing:.22em}.copy h1{max-width:350px;margin:0;color:#111714;font-family:"Songti SC",STSong,serif;font-size:53px;font-weight:600;line-height:1.07;letter-spacing:-.05em}.sub{max-width:292px;margin:23px 0 0;color:#74817b;font-family:"Songti SC",STSong,serif;font-size:16px;line-height:1.8}
    .rose{position:absolute;z-index:2;right:18px;bottom:100px;width:175px;height:330px;transform:rotate(-4deg)}.halo{position:absolute;top:16px;left:2px;width:172px;height:172px;border:1px solid rgba(111,149,133,.16);border-radius:50%;background:radial-gradient(circle,rgba(214,229,222,.46),transparent 68%);box-shadow:0 23px 55px rgba(45,70,59,.08)}.bloom{position:absolute;top:38px;left:33px;width:102px;height:96px;filter:drop-shadow(0 20px 16px rgba(14,18,16,.19))}.bloom i{position:absolute;left:50%;bottom:2px;width:57px;height:72px;transform-origin:50% 100%;border:1px solid rgba(255,255,255,.08);border-radius:62% 38% 56% 44%/70% 54% 46% 30%;background:linear-gradient(145deg,#3a3437 2%,#151114 50%,#030303 100%);box-shadow:-8px 9px 18px rgba(0,0,0,.18) inset}.bloom i:nth-child(1){transform:translateX(-50%) rotate(-38deg) scale(.94)}.bloom i:nth-child(2){transform:translateX(-50%) rotate(38deg) scale(.94)}.bloom i:nth-child(3){transform:translate(-61%,-7px) rotate(-18deg) scale(.77)}.bloom i:nth-child(4){transform:translate(-39%,-7px) rotate(18deg) scale(.77)}.bloom i:nth-child(5){transform:translate(-50%,-14px) rotate(-5deg) scale(.6)}.bloom i:nth-child(6){width:31px;height:46px;transform:translate(-50%,-22px) rotate(16deg) scale(.58);background:linear-gradient(145deg,#473f43,#090708 70%)}.stem{position:absolute;top:122px;left:86px;width:5px;height:175px;transform:rotate(-7deg);border-radius:99px;background:linear-gradient(90deg,#263028,#080b08 60%,#374439)}.leaf{position:absolute;width:53px;height:25px;background:linear-gradient(145deg,#344239,#0c140f 72%)}.l1{top:172px;left:35px;transform:rotate(25deg) skewX(-13deg);border-radius:100% 0 100% 0}.l2{top:211px;right:12px;transform:rotate(-21deg) skewX(13deg);border-radius:0 100% 0 100%}.name{position:absolute;right:8px;bottom:3px;padding:5px 10px;border:1px solid #dfe7e3;border-radius:99px;background:#fff;color:#60746b;font-family:Georgia,serif;font-size:9px;letter-spacing:.22em}
    .action{position:absolute;z-index:5;left:26px;bottom:34px;width:188px;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 24px;border-radius:99px;background:#284238;color:#fff;font-size:14px;font-weight:750;box-shadow:0 18px 36px rgba(40,66,56,.2)}.action b{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.12);color:#dcebe4;font-family:Georgia,serif;font-size:18px}
    .side .kicker{margin:0 0 14px;color:#547466;font-size:12px;font-weight:760;letter-spacing:.18em}.side h2{margin:0;font-family:"Songti SC",STSong,serif;font-size:36px;font-weight:600;line-height:1.3}.side>p{margin:17px 0 0;color:#65736d;font-size:15px;line-height:1.8}.palette{display:flex;gap:10px;margin-top:27px}.swatch{flex:1;padding:8px;border:1px solid rgba(111,149,133,.18);border-radius:13px;background:rgba(255,255,255,.58);color:#68766f;font-family:Georgia,serif;font-size:9px;text-align:center}.swatch i{height:30px;display:block;margin-bottom:7px;border-radius:8px}.notes{display:grid;gap:10px;margin-top:24px;padding:18px;border:1px solid rgba(111,149,133,.16);border-radius:19px;background:rgba(255,255,255,.5)}.note{display:flex;gap:9px;color:#68766f;font-size:12px;line-height:1.55}.note b{color:#547466}.decisions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.decision{min-height:50px;display:grid;place-items:center;border:1px solid #d7e2dd;border-radius:99px;background:rgba(255,255,255,.88);color:#43524b;font-size:13px;font-weight:700;cursor:pointer}.decision.primary{border-color:#6f9585;background:#284238;color:#fff}.decision.selected{outline:3px solid rgba(111,149,133,.22)}
    @media(max-width:820px){.review{grid-template-columns:minmax(300px,460px);padding:24px 0 40px}.phone{min-height:740px;border-radius:30px}.copy{padding-top:60px}.copy h1{font-size:46px}.side{padding:0 8px}.side h2{font-size:30px}}
  </style>
</head>
<body>
  <main class="review">
    <section class="phone"><div class="date"><span>QIXI</span><i></i><span>2026</span></div><div class="copy"><p class="eyebrow">我们的第一个七夕</p><h1>何花花的<br>第一个七夕。</h1><p class="sub">抱着刻有你名字的黑色玫瑰，我们出发吧</p></div><div class="rose"><span class="halo"></span><span class="bloom"><i></i><i></i><i></i><i></i><i></i><i></i></span><span class="stem"></span><span class="leaf l1"></span><span class="leaf l2"></span><span class="name">H · H</span></div><div class="action"><span>现在出发</span><b>↗</b></div></section>
    <aside class="side"><p class="kicker">DIRECTION 01 · FINAL</p><h2>白纸编辑感</h2><p>暖白承担整个页面，鼠尾草绿只负责节奏与行动；黑玫瑰保持纯黑，成为首页唯一的视觉重心。</p><div class="palette"><div class="swatch"><i style="background:#fffefa"></i>#FFFEFA</div><div class="swatch"><i style="background:#6f9585"></i>#6F9585</div><div class="swatch"><i style="background:#284238"></i>#284238</div><div class="swatch"><i style="background:#111714"></i>#111714</div></div><div class="notes"><div class="note"><b>01</b><span>去掉酒红与金色大面积光晕。</span></div><div class="note"><b>02</b><span>保留黑玫瑰造型、位置和呼吸动画。</span></div><div class="note"><b>03</b><span>按钮改为深鼠尾草绿，与问卷进度色呼应。</span></div></div><div class="decisions"><div class="decision primary" data-choice="confirm-home-editorial-white" onclick="toggleSelect(this)">确认采用</div><div class="decision" data-choice="adjust-home-editorial-white" onclick="toggleSelect(this)">继续调整</div></div></aside>
  </main>
</body>
</html>
