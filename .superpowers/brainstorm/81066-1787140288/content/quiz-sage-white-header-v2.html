<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>问卷配色确认 v2</title>
  <style>
    *{box-sizing:border-box} :root{--ink:#17211d;--muted:#7a8882;--sage:#789b8c;--deep:#547466;--pale:#eaf2ee;--line:#dfe8e3}
    body{min-height:100vh;margin:0;color:var(--ink);background:radial-gradient(circle at 10% 8%,#fff,transparent 26%),radial-gradient(circle at 88% 82%,rgba(185,206,197,.45),transparent 28%),#edf2ef;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    .wrap{width:min(1080px,calc(100% - 36px));min-height:100vh;display:grid;grid-template-columns:minmax(320px,440px) minmax(270px,370px);align-items:center;justify-content:center;gap:clamp(38px,7vw,88px);margin:auto;padding:36px 0}
    .phone{min-height:780px;position:relative;overflow:hidden;padding:30px 28px 26px;border:1px solid #dce6e1;border-radius:38px;background:linear-gradient(rgba(118,155,140,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(118,155,140,.035) 1px,transparent 1px),radial-gradient(circle at 97% 2%,rgba(198,217,208,.35),transparent 27%),linear-gradient(160deg,#fff,#f8fbf9);background-size:58px 58px,58px 58px,auto,auto;box-shadow:0 32px 90px rgba(42,65,55,.18)}
    .header{display:flex;align-items:center;justify-content:space-between;color:var(--deep);font-family:Georgia,serif;font-size:11px;font-weight:700;letter-spacing:.09em}
    .back{width:42px;height:42px;display:grid;place-items:center;border:1px solid #e0e8e4;border-radius:50%;background:rgba(255,255,255,.88);color:#607069;font-family:-apple-system,sans-serif;font-size:20px;box-shadow:0 7px 18px rgba(55,80,69,.05)}
    .progress{height:3px;overflow:hidden;margin-top:24px;border-radius:99px;background:#e8efeb}.progress span{width:66.66%;height:100%;display:block;border-radius:inherit;background:linear-gradient(90deg,var(--deep),#9db8ac);box-shadow:0 0 12px rgba(120,155,140,.22)}
    .content{padding-top:88px}.eyebrow{margin:0 0 20px;color:var(--deep);font-family:Georgia,serif;font-size:12px;font-weight:700;letter-spacing:.22em}
    h1{margin:0;font-family:"Songti SC",STSong,serif;font-size:42px;font-weight:600;line-height:1.25;letter-spacing:-.035em}
    .answers{display:grid;gap:12px;margin-top:44px}.answer{min-height:76px;display:grid;grid-template-columns:38px 1fr 22px;align-items:center;gap:10px;padding:12px 17px;border:1px solid var(--line);border-radius:19px;background:rgba(255,255,255,.84);box-shadow:0 10px 28px rgba(52,76,66,.045)}
    .num{color:#88a598;font-family:Georgia,serif;font-size:11px;letter-spacing:.1em}.answer strong{font-size:16px;font-weight:640}.arrow{color:#91a099;font-family:Georgia,serif;font-size:17px}.answer.selected{border-color:var(--sage);background:linear-gradient(135deg,#6f9283,var(--deep));color:#fff;box-shadow:0 17px 36px rgba(69,103,88,.24)}.selected .num,.selected .arrow{color:#e7f1ec}
    .hint{margin:27px 0 0;color:#8b9892;font-family:"Songti SC",STSong,serif;font-size:12px;text-align:center}
    .side .kicker{margin:0 0 14px;color:var(--deep);font-size:12px;font-weight:750;letter-spacing:.18em}.side h2{margin:0;font-family:"Songti SC",STSong,serif;font-size:36px;font-weight:600;line-height:1.3}.side p{color:#65736d;font-size:15px;line-height:1.8}
    .change{margin-top:26px;padding:20px;border:1px solid rgba(120,155,140,.17);border-radius:20px;background:rgba(255,255,255,.52)}.change b{display:block;margin-bottom:8px;color:var(--deep);font-size:13px}.change span{color:#68766f;font-size:13px;line-height:1.65}
    .decisions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}.decision{min-height:50px;display:grid;place-items:center;border:1px solid #d7e2dd;border-radius:999px;background:rgba(255,255,255,.88);color:#43524b;font-size:13px;font-weight:700;cursor:pointer;transition:.18s ease}.decision:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(42,65,55,.1)}.decision.primary{border-color:var(--sage);background:var(--deep);color:#fff}.decision.selected{outline:3px solid rgba(120,155,140,.22)}
    @media(max-width:820px){.wrap{grid-template-columns:minmax(300px,460px);padding:24px 0 40px}.phone{min-height:720px;border-radius:30px}.content{padding-top:58px}h1{font-size:34px}.side{padding:0 8px}.side h2{font-size:30px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="phone">
      <header class="header"><div class="back">←</div><span>02 / 03</span></header>
      <div class="progress"><span></span></div>
      <div class="content">
        <p class="eyebrow">QUESTION 02</p>
        <h1>《乐队的夏天》中，哪个组合你最想和男朋友去一次？</h1>
        <div class="answers">
          <div class="answer"><span class="num">01</span><strong>本拉登</strong><span class="arrow">→</span></div>
          <div class="answer selected"><span class="num">02</span><strong>新裤子乐队</strong><span class="arrow">→</span></div>
          <div class="answer"><span class="num">03</span><strong>披投士</strong><span class="arrow">→</span></div>
        </div>
        <p class="hint">凭第一感觉选就好，没有标准答案。</p>
      </div>
    </section>
    <aside class="side">
      <p class="kicker">A · SAGE WHITE · V2</p>
      <h2>顶栏已经减到最简</h2>
      <p>去掉中间英文后，注意力会更自然地落到问题本身，顶部也更像一张克制、精致的邀请卡。</p>
      <div class="change"><b>本次调整</b><span>左侧只保留返回，右侧保留进度数字；进度条继续横贯下方，中间不再放任何标题。</span></div>
      <div class="decisions">
        <div class="decision primary" data-choice="confirm-sage-white-v2" onclick="toggleSelect(this)">确认这版</div>
        <div class="decision" data-choice="adjust-sage-white-v2" onclick="toggleSelect(this)">继续调整</div>
      </div>
    </aside>
  </main>
</body>
</html>
